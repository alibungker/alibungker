<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Muhammad Ali Murtaza — AI Engineer</title><desc id="desc">Dark technology banner with animated neural network nodes.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B17"/><stop offset=".55" stop-color="#0B1730"/><stop offset="1" stop-color="#11102A"/></linearGradient><linearGradient id="a"><stop stop-color="#22D3EE"/><stop offset=".55" stop-color="#3B82F6"/><stop offset="1" stop-color="#A78BFA"/></linearGradient><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8AB4F8" stroke-opacity=".08"/></pattern><radialGradient id="gl"><stop stop-color="#2563EB" stop-opacity=".4"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="360" rx="26" fill="url(#bg)"/><rect width="1200" height="360" rx="26" fill="url(#g)"/><circle cx="950" cy="170" r="250" fill="url(#gl)"/>
<!-- MATRIX CODE RAIN + LINUX / NETWORK / SQL SECURITY TERMINAL -->
<defs>
  <linearGradient id="matrixGreen" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#D9FFE8"/><stop offset=".35" stop-color="#4ADE80"/>
    <stop offset="1" stop-color="#166534" stop-opacity=".12"/>
  </linearGradient>
  <linearGradient id="terminalFade" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#07130F" stop-opacity=".05"/><stop offset=".18" stop-color="#07130F" stop-opacity=".9"/>
    <stop offset=".82" stop-color="#07130F" stop-opacity=".9"/><stop offset="1" stop-color="#07130F" stop-opacity=".05"/>
  </linearGradient>
  <filter id="matrixGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="matrixClip"><rect x="690" y="20" width="490" height="320" rx="12"/></clipPath>
</defs>
<g clip-path="url(#matrixClip)">
  <rect x="690" y="20" width="490" height="320" fill="#020B08" opacity=".36"/>
  <!-- vertical streams of continuously rising code -->
  <g font-family="monospace" font-size="14" font-weight="600" fill="url(#matrixGreen)" filter="url(#matrixGlow)" opacity=".82">
    <g transform="translate(710 -330)"><text x="0" y="0">01</text><text y="22">10</text><text y="44">A7</text><text y="66">sudo</text><text y="88">0xF2</text><text y="110">101</text><text y="132">ssh</text><text y="154">C0DE</text><text y="176">0110</text><text y="198">root</text><text y="220">AF09</text><text y="242">tcp</text><text y="264">1101</text><text y="286">SQL</text><text y="308">0x7B</text><text y="330">1010</text><animateTransform attributeName="transform" type="translate" values="710 -330;710 20" dur="8s" repeatCount="indefinite"/></g>
    <g transform="translate(755 -80)" opacity=".68"><text y="0">0101</text><text y="22">nmap</text><text y="44">1100</text><text y="66">eth0</text><text y="88">0xA1</text><text y="110">scan</text><text y="132">0111</text><text y="154">443</text><text y="176">root</text><text y="198">1001</text><text y="220">ping</text><text y="242">0xFF</text><text y="264">1010</text><text y="286">db01</text><text y="308">0110</text><animateTransform attributeName="transform" type="translate" values="755 -360;755 -10" dur="10s" repeatCount="indefinite"/></g>
    <g transform="translate(810 -290)" opacity=".58"><text y="0">SELECT</text><text y="22">0011</text><text y="44">WHERE</text><text y="66">0x9C</text><text y="88">JOIN</text><text y="110">1010</text><text y="132">NULL</text><text y="154">sudo</text><text y="176">1101</text><text y="198">FROM</text><text y="220">0xB2</text><text y="242">tcp</text><text y="264">DROP</text><text y="286">0101</text><text y="308">USER</text><text y="330">0110</text><animateTransform attributeName="transform" type="translate" values="810 -290;810 60" dur="9s" repeatCount="indefinite"/></g>
    <g transform="translate(875 -130)" opacity=".75"><text y="0">1010</text><text y="22">443/tcp</text><text y="44">root@ai</text><text y="66">0x1A</text><text y="88">SYN</text><text y="110">0100</text><text y="132">SELECT</text><text y="154">ssh-key</text><text y="176">1011</text><text y="198">JOIN</text><text y="220">0xD4</text><text y="242">ACK</text><text y="264">0110</text><text y="286">audit</text><text y="308">1010</text><animateTransform attributeName="transform" type="translate" values="875 -350;875 0" dur="7.5s" repeatCount="indefinite"/></g>
    <g transform="translate(950 -350)" opacity=".55"><text y="0">0xC4</text><text y="22">chmod</text><text y="44">0101</text><text y="66">443</text><text y="88">nmap</text><text y="110">1100</text><text y="132">SELECT</text><text y="154">0xEF</text><text y="176">sudo</text><text y="198">0010</text><text y="220">index</text><text y="242">1011</text><text y="264">JOIN</text><text y="286">0xA0</text><text y="308">0101</text><text y="330">audit</text><animateTransform attributeName="transform" type="translate" values="950 -350;950 0" dur="11s" repeatCount="indefinite"/></g>
    <g transform="translate(1030 -180)" opacity=".72"><text y="0">iptables</text><text y="22">1101</text><text y="44">0x7F</text><text y="66">SYN/ACK</text><text y="88">0100</text><text y="110">INFORMATION_SCHEMA</text><text y="132">tcpdump</text><text y="154">1010</text><text y="176">EXPLAIN</text><text y="198">0xA9</text><text y="220">firewall</text><text y="242">0101</text><text y="264">SELECT</text><text y="286">1100</text><text y="308">ss -tulpn</text><animateTransform attributeName="transform" type="translate" values="1030 -360;1030 -10" dur="8.8s" repeatCount="indefinite"/></g>
    <g transform="translate(1120 -300)" opacity=".6"><text y="0">0101</text><text y="22">443</text><text y="44">0x2E</text><text y="66">SSH</text><text y="88">1001</text><text y="110">scan</text><text y="132">DROP</text><text y="154">0101</text><text y="176">kernel</text><text y="198">0xB1</text><text y="220">JOIN</text><text y="242">1010</text><text y="264">TLS</text><text y="286">0100</text><text y="308">root</text><animateTransform attributeName="transform" type="translate" values="1120 -360;1120 -10" dur="9.6s" repeatCount="indefinite"/></g>
  </g>
  <!-- translucent live terminal overlay -->
  <rect x="822" y="105" width="345" height="208" rx="9" fill="#020906" fill-opacity=".9" stroke="#22C55E" stroke-opacity=".55"/>
  <path d="M822 132H1167" stroke="#22C55E" stroke-opacity=".45"/>
  <circle cx="838" cy="119" r="3.5" fill="#4ADE80"/><circle cx="850" cy="119" r="3.5" fill="#FACC15" opacity=".8"/><circle cx="862" cy="119" r="3.5" fill="#F87171" opacity=".8"/>
  <text x="879" y="123" fill="#86EFAC" font-family="monospace" font-size="10">SECURITY CONSOLE — LIVE</text>
  <g font-family="monospace" font-size="11.5" fill="#86EFAC">
    <text x="837" y="153">$ sudo nmap -sV -O 10.10.0.0/24</text>
    <text x="837" y="173" fill="#4ADE80">[+] Network discovery initialized</text>
    <text x="837" y="193">[+] Host 10.10.0.12  PORT 22 / 443</text>
    <text x="837" y="213" fill="#A7F3D0">$ sqlmap -u "https://host/item?id=1"</text>
    <text x="837" y="233" fill="#4ADE80">[*] Checking parameters &amp; DBMS</text>
    <text x="837" y="253">[+] SQL audit simulation: running</text>
    <text x="837" y="273" fill="#86EFAC">$ ss -tulpn  |  ip addr</text>
    <text x="837" y="293" fill="#4ADE80">SYSTEM STATUS: <tspan fill="#D9FFE8">SECURE</tspan></text>
  </g>
  <rect x="837" y="301" width="306" height="3" rx="1.5" fill="#14532D"/>
  <rect x="837" y="301" width="210" height="3" rx="1.5" fill="#4ADE80">
    <animate attributeName="width" values="35;290;120;260;35" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="1149" y="284" width="7" height="12" fill="#4ADE80">
    <animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/>
  </rect>
  <rect x="690" y="20" width="490" height="320" rx="12" fill="url(#terminalFade)" opacity=".22"/>
  <!-- scanning sweep -->
  <path d="M695 34H1175" stroke="#4ADE80" stroke-width="1.5" opacity=".6">
    <animate attributeName="d" values="M695 34H1175;M695 330H1175;M695 34H1175" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".05;.7;.05" dur="6s" repeatCount="indefinite"/>
  </path>
</g>
<g fill="#4ADE80" font-family="monospace" font-size="9" letter-spacing="1.4" opacity=".9">
  <text x="704" y="352">LIVE CODE STREAM // NETWORK &amp; DATABASE DIAGNOSTICS</text>
</g>

<path d="M64 74H110" stroke="url(#a)" stroke-width="4" stroke-linecap="round"/><text x="64" y="128" fill="#93C5FD" font-family="Inter,Segoe UI,Arial" font-size="17" font-weight="700" letter-spacing="4">AI ENGINEER / SOLUTION ARCHITECT</text><text x="60" y="198" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="54" font-weight="800">Muhammad Ali Murtaza</text><text x="64" y="244" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="21">Engineering intelligent systems for real-world impact.</text><g fill="#67E8F9" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="600" letter-spacing="1.5"><text x="64" y="306">LLM  ·  RAG  ·  NLP  ·  GOVTECH  ·  DATA SYSTEMS</text></g><rect x="1" y="1" width="1198" height="358" rx="25" fill="none" stroke="#334155" stroke-opacity=".7"/></svg>