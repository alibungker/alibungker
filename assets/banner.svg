<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Muhammad Ali Murtaza — AI Engineer</title><desc id="desc">Dark technology banner with animated neural network nodes.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B17"/><stop offset=".55" stop-color="#0B1730"/><stop offset="1" stop-color="#11102A"/></linearGradient><linearGradient id="a"><stop stop-color="#22D3EE"/><stop offset=".55" stop-color="#3B82F6"/><stop offset="1" stop-color="#A78BFA"/></linearGradient><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8AB4F8" stroke-opacity=".08"/></pattern><radialGradient id="gl"><stop stop-color="#2563EB" stop-opacity=".4"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="360" rx="26" fill="url(#bg)"/><rect width="1200" height="360" rx="26" fill="url(#g)"/><circle cx="950" cy="170" r="250" fill="url(#gl)"/>
<g fill="none" stroke="url(#a)" stroke-width="1.7" opacity=".65"><path d="M720 65 840 120 960 70 1080 130 1160 75M720 65 760 205 900 250 960 70M840 120 900 250 1080 130 1110 280M960 70 1020 210 1160 75M760 205 840 300 900 250 1020 210 1110 280 1160 220"/></g>
<g fill="#67E8F9"><circle cx="720" cy="65" r="4"/><circle cx="840" cy="120" r="5"/><circle cx="960" cy="70" r="4"/><circle cx="1080" cy="130" r="5"/><circle cx="1160" cy="75" r="4"/><circle cx="760" cy="205" r="5"/><circle cx="900" cy="250" r="4"/><circle cx="1020" cy="210" r="5"/><circle cx="1110" cy="280" r="4"/><circle cx="840" cy="300" r="3"/></g>
<g fill="none" stroke="#67E8F9"><circle cx="900" cy="150" r="28" stroke-width="2" stroke-dasharray="5 8"><animateTransform attributeName="transform" type="rotate" from="0 900 150" to="360 900 150" dur="24s" repeatCount="indefinite"/></circle><circle cx="900" cy="150" r="48" stroke-opacity=".4" stroke-dasharray="2 10"><animateTransform attributeName="transform" type="rotate" from="360 900 150" to="0 900 150" dur="34s" repeatCount="indefinite"/></circle></g>

<!-- JARVIS-inspired holographic AI android interface -->
<defs>
  <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#E0F7FF"/><stop offset=".28" stop-color="#67E8F9"/>
    <stop offset=".62" stop-color="#3986D8"/><stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#16466C"/><stop offset=".5" stop-color="#071B32"/><stop offset="1" stop-color="#102D50"/>
  </linearGradient>
  <radialGradient id="coreGlow">
    <stop stop-color="#22D3EE" stop-opacity=".28"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="visorClip"><path d="M-67 -22Q-62 -65 0 -67Q62 -65 67 -22L61 25Q48 57 0 59Q-48 57 -61 25Z"/></clipPath>
</defs>
<g transform="translate(1038 184)">
  <animateTransform attributeName="transform" type="translate" values="1038 187;1038 179;1038 187" dur="4.6s" repeatCount="indefinite"/>
  <circle r="142" fill="url(#coreGlow)"/>
  <!-- orbital HUD rings -->
  <g fill="none" stroke="#36DDF5" filter="url(#cyanGlow)">
    <circle r="116" stroke-opacity=".28" stroke-width="1" stroke-dasharray="2 8"/>
    <circle r="104" stroke-opacity=".8" stroke-width="1.4" stroke-dasharray="38 12 4 12">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/>
    </circle>
    <circle r="91" stroke-opacity=".34" stroke-width="1" stroke-dasharray="3 7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="21s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g stroke="#A78BFA" stroke-width="2" stroke-linecap="round">
    <path d="M0 -128V-116M0 116V128M-128 0H-116M116 0H128"/>
    <path d="M-91 -91L-83 -83M91 91L83 83M91 -91L83 -83M-91 91L-83 83" opacity=".75"/>
  </g>
  <!-- floating data markers -->
  <g fill="#67E8F9">
    <circle cx="-112" cy="-33" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="111" cy="40" r="3"><animate attributeName="opacity" values="1;.2;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="63" cy="-101" r="2.5"><animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <!-- android head and shoulders -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-1 0 0;1.5 0 0;-1 0 0" dur="5.5s" repeatCount="indefinite"/>
    <path d="M-76 103Q-67 64 -33 59L-22 48H22L33 59Q67 64 76 103L83 119H-83Z" fill="#102B49" stroke="url(#chrome)" stroke-width="2.5"/>
    <path d="M-49 91Q0 70 49 91L61 113H-61Z" fill="#0A1B30" stroke="#3986D8" stroke-opacity=".7"/>
    <path d="M-20 56V72M20 56V72" stroke="#67E8F9" stroke-width="5" stroke-linecap="round"/>
    <path d="M-14 89H14" stroke="#67E8F9" stroke-width="2" opacity=".8"/>
    <!-- neck -->
    <path d="M-19 43V59Q0 72 19 59V43" fill="#12395A" stroke="#67E8F9" stroke-width="2"/>
    <!-- head shell -->
    <path d="M-67 -22Q-62 -65 0 -67Q62 -65 67 -22L61 25Q48 57 0 59Q-48 57 -61 25Z" fill="url(#visor)" stroke="url(#chrome)" stroke-width="3"/>
    <path d="M-54 -35Q-38 -58 0 -59Q38 -58 54 -35" fill="none" stroke="#D9FBFF" stroke-opacity=".55" stroke-width="2"/>
    <path d="M-68 -10L-78 -2V20L-64 28M68 -10L78 -2V20L64 28" fill="#12395A" stroke="#67E8F9" stroke-width="2"/>
    <g clip-path="url(#visorClip)">
      <path d="M-70 -4H70" stroke="#67E8F9" stroke-width="1" opacity=".35"/>
      <path d="M-70 0H70" stroke="#67E8F9" stroke-width="2" opacity=".55">
        <animate attributeName="d" values="M-70 -27H70;M-70 31H70;M-70 -27H70" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".05;.65;.05" dur="4s" repeatCount="indefinite"/>
      </path>
      <!-- expressive luminous eyes -->
      <g fill="#8AF5FF" filter="url(#cyanGlow)">
        <path d="M-43 -13Q-29 -25 -14 -13Q-29 -4 -43 -13Z">
          <animate attributeName="d" values="M-43 -13Q-29 -25 -14 -13Q-29 -4 -43 -13Z;M-43 -13Q-29 -14 -14 -13Q-29 -12 -43 -13Z;M-43 -13Q-29 -25 -14 -13Q-29 -4 -43 -13Z" keyTimes="0;.08;.16" dur="5s" repeatCount="indefinite"/>
        </path>
        <path d="M14 -13Q29 -25 43 -13Q29 -4 14 -13Z">
          <animate attributeName="d" values="M14 -13Q29 -25 43 -13Q29 -4 14 -13Z;M14 -13Q29 -14 43 -13Q29 -12 14 -13Z;M14 -13Q29 -25 43 -13Q29 -4 14 -13Z" keyTimes="0;.08;.16" dur="5s" repeatCount="indefinite"/>
        </path>
      </g>
      <!-- talking mouth: cycles between closed, open and smile -->
      <path d="M-19 27Q0 31 19 27Q0 47 -19 27Z" fill="#67E8F9" opacity=".9" filter="url(#cyanGlow)">
        <animate attributeName="d" values="M-19 27Q0 31 19 27Q0 47 -19 27Z;M-19 25Q0 20 19 25Q0 53 -19 25Z;M-19 27Q0 34 19 27Q0 40 -19 27Z;M-19 25Q0 20 19 25Q0 53 -19 25Z;M-19 27Q0 31 19 27Q0 47 -19 27Z" dur=".9s" repeatCount="indefinite"/>
      </path>
      <path d="M-25 8H25" stroke="#67E8F9" stroke-opacity=".24" stroke-width="1"/>
    </g>
    <!-- side temple lights -->
    <g fill="#A78BFA" filter="url(#cyanGlow)">
      <circle cx="-60" cy="5" r="3"><animate attributeName="opacity" values=".3;1;.3" dur="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="60" cy="5" r="3"><animate attributeName="opacity" values="1;.3;1" dur="1.2s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <!-- voice activity waveform -->
  <g transform="translate(0 139)" stroke="#67E8F9" stroke-width="2.8" stroke-linecap="round" filter="url(#cyanGlow)">
    <path d="M-38 0V-5M-25 0V-12M-12 0V-19M0 0V-11M12 0V-23M25 0V-13M38 0V-6">
      <animate attributeName="d" values="M-38 0V-5M-25 0V-12M-12 0V-19M0 0V-11M12 0V-23M25 0V-13M38 0V-6;M-38 0V-16M-25 0V-7M-12 0V-25M0 0V-17M12 0V-9M25 0V-22M38 0V-13;M-38 0V-5M-25 0V-12M-12 0V-19M0 0V-11M12 0V-23M25 0V-13M38 0V-6" dur=".75s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#93C5FD" font-family="Inter,Segoe UI,Arial" font-size="8" letter-spacing="2" text-anchor="middle">
    <text x="0" y="-145">J.A.R.V.I.S  /  ONLINE</text>
  </g>
</g>

<path d="M64 74H110" stroke="url(#a)" stroke-width="4" stroke-linecap="round"/><text x="64" y="128" fill="#93C5FD" font-family="Inter,Segoe UI,Arial" font-size="17" font-weight="700" letter-spacing="4">AI ENGINEER / SOLUTION ARCHITECT</text><text x="60" y="198" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="54" font-weight="800">Muhammad Ali Murtaza</text><text x="64" y="244" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="21">Engineering intelligent systems for real-world impact.</text><g fill="#67E8F9" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="600" letter-spacing="1.5"><text x="64" y="306">LLM  ·  RAG  ·  NLP  ·  GOVTECH  ·  DATA SYSTEMS</text></g><rect x="1" y="1" width="1198" height="358" rx="25" fill="none" stroke="#334155" stroke-opacity=".7"/></svg>