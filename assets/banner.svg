<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Muhammad Ali Murtaza — AI Engineer</title><desc id="desc">Dark technology banner with animated neural network nodes.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B17"/><stop offset=".55" stop-color="#0B1730"/><stop offset="1" stop-color="#11102A"/></linearGradient><linearGradient id="a"><stop stop-color="#22D3EE"/><stop offset=".55" stop-color="#3B82F6"/><stop offset="1" stop-color="#A78BFA"/></linearGradient><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8AB4F8" stroke-opacity=".08"/></pattern><radialGradient id="gl"><stop stop-color="#2563EB" stop-opacity=".4"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="360" rx="26" fill="url(#bg)"/><rect width="1200" height="360" rx="26" fill="url(#g)"/><circle cx="950" cy="170" r="250" fill="url(#gl)"/>
<g fill="none" stroke="url(#a)" stroke-width="1.7" opacity=".65"><path d="M720 65 840 120 960 70 1080 130 1160 75M720 65 760 205 900 250 960 70M840 120 900 250 1080 130 1110 280M960 70 1020 210 1160 75M760 205 840 300 900 250 1020 210 1110 280 1160 220"/></g>
<g fill="#67E8F9"><circle cx="720" cy="65" r="4"/><circle cx="840" cy="120" r="5"/><circle cx="960" cy="70" r="4"/><circle cx="1080" cy="130" r="5"/><circle cx="1160" cy="75" r="4"/><circle cx="760" cy="205" r="5"/><circle cx="900" cy="250" r="4"/><circle cx="1020" cy="210" r="5"/><circle cx="1110" cy="280" r="4"/><circle cx="840" cy="300" r="3"/></g>
<g fill="none" stroke="#67E8F9"><circle cx="900" cy="150" r="28" stroke-width="2" stroke-dasharray="5 8"><animateTransform attributeName="transform" type="rotate" from="0 900 150" to="360 900 150" dur="24s" repeatCount="indefinite"/></circle><circle cx="900" cy="150" r="48" stroke-opacity=".4" stroke-dasharray="2 10"><animateTransform attributeName="transform" type="rotate" from="360 900 150" to="0 900 150" dur="34s" repeatCount="indefinite"/></circle></g>

<!-- Animated AI assistant robot: floating, speaking and gesturing -->
<g transform="translate(1010 92)">
  <animateTransform attributeName="transform" type="translate" values="1010 96;1010 88;1010 96" dur="3.2s" repeatCount="indefinite"/>
  <ellipse cx="52" cy="170" rx="55" ry="9" fill="#020617" opacity=".42">
    <animate attributeName="rx" values="55;48;55" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".42;.25;.42" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>
  <!-- antenna -->
  <path d="M52 4V-8" stroke="#67E8F9" stroke-width="4" stroke-linecap="round"/>
  <circle cx="52" cy="-12" r="6" fill="#A78BFA">
    <animate attributeName="opacity" values="1;.35;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <!-- head -->
  <rect x="4" y="0" width="96" height="72" rx="22" fill="#0F2745" stroke="#67E8F9" stroke-width="3"/>
  <rect x="12" y="8" width="80" height="56" rx="16" fill="#102F50"/>
  <path d="M18 13H82" stroke="#A5F3FC" stroke-opacity=".28" stroke-width="2" stroke-linecap="round"/>
  <!-- eyes -->
  <g fill="#67E8F9">
    <ellipse cx="32" cy="31" rx="7" ry="9">
      <animate attributeName="ry" values="9;1;9" dur="4.8s" keyTimes="0;0.48;1" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="72" cy="31" rx="7" ry="9">
      <animate attributeName="ry" values="9;1;9" dur="4.8s" keyTimes="0;0.48;1" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <!-- speaking mouth -->
  <rect x="37" y="48" width="30" height="5" rx="2.5" fill="#A78BFA">
    <animate attributeName="height" values="4;12;3;9;4" dur=".72s" repeatCount="indefinite"/>
    <animate attributeName="y" values="49;45;50;46;49" dur=".72s" repeatCount="indefinite"/>
  </rect>
  <!-- neck and torso -->
  <path d="M43 72V82M61 72V82" stroke="#67E8F9" stroke-width="5" stroke-linecap="round"/>
  <rect x="14" y="82" width="76" height="70" rx="18" fill="#12345A" stroke="#3B82F6" stroke-width="3"/>
  <rect x="29" y="94" width="46" height="35" rx="9" fill="#071827" stroke="#67E8F9" stroke-opacity=".7"/>
  <path d="M39 111H65" stroke="#67E8F9" stroke-width="3" stroke-linecap="round">
    <animate attributeName="opacity" values=".25;1;.25" dur="1s" repeatCount="indefinite"/>
  </path>
  <circle cx="52" cy="140" r="4" fill="#A78BFA"/>
  <!-- left arm gesture -->
  <g transform="translate(15 91)">
    <animateTransform attributeName="transform" type="rotate" values="0 0 0;-24 0 0;0 0 0" dur="1.8s" repeatCount="indefinite"/>
    <path d="M0 7L-18 27" stroke="#67E8F9" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-20" cy="29" r="8" fill="#A78BFA" stroke="#67E8F9" stroke-width="2"/>
  </g>
  <!-- right arm wave -->
  <g transform="translate(88 94)">
    <animateTransform attributeName="transform" type="rotate" values="0 0 0;-34 0 0;12 0 0;0 0 0" dur="1.25s" repeatCount="indefinite"/>
    <path d="M0 5L18 -13" stroke="#67E8F9" stroke-width="10" stroke-linecap="round"/>
    <circle cx="22" cy="-17" r="8" fill="#A78BFA" stroke="#67E8F9" stroke-width="2"/>
  </g>
  <!-- feet -->
  <path d="M34 151V160M70 151V160" stroke="#67E8F9" stroke-width="9" stroke-linecap="round"/>
</g>
<!-- speech bubble and animated sound signal -->
<g>
  <rect x="1105" y="65" width="72" height="40" rx="14" fill="#102F50" stroke="#67E8F9" stroke-width="1.8"/>
  <path d="M1120 105L1114 114L1135 105" fill="#102F50" stroke="#67E8F9" stroke-width="1.8" stroke-linejoin="round"/>
  <g fill="#67E8F9">
    <circle cx="1124" cy="85" r="3"><animate attributeName="cy" values="85;80;85" dur=".65s" repeatCount="indefinite"/></circle>
    <circle cx="1141" cy="85" r="3"><animate attributeName="cy" values="85;80;85" begin=".16s" dur=".65s" repeatCount="indefinite"/></circle>
    <circle cx="1158" cy="85" r="3"><animate attributeName="cy" values="85;80;85" begin=".32s" dur=".65s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M1180 133q10 10 0 20M1188 126q17 17 0 34" fill="none" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" opacity=".8">
    <animate attributeName="opacity" values=".15;.9;.15" dur="1.1s" repeatCount="indefinite"/>
  </path>
</g>

<path d="M64 74H110" stroke="url(#a)" stroke-width="4" stroke-linecap="round"/><text x="64" y="128" fill="#93C5FD" font-family="Inter,Segoe UI,Arial" font-size="17" font-weight="700" letter-spacing="4">AI ENGINEER / SOLUTION ARCHITECT</text><text x="60" y="198" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial" font-size="54" font-weight="800">Muhammad Ali Murtaza</text><text x="64" y="244" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial" font-size="21">Engineering intelligent systems for real-world impact.</text><g fill="#67E8F9" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="600" letter-spacing="1.5"><text x="64" y="306">LLM  ·  RAG  ·  NLP  ·  GOVTECH  ·  DATA SYSTEMS</text></g><rect x="1" y="1" width="1198" height="358" rx="25" fill="none" stroke="#334155" stroke-opacity=".7"/></svg>